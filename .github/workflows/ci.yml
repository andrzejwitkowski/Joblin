name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests
        run: ./gradlew test --no-daemon
        working-directory: backend

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t joblin:ci .

name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release version
        id: version
        run: node ./scripts/resolve-release-version.mjs "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.wattly.pl
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.title=Joblin
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            registry.wattly.pl/joblin:${{ steps.version.outputs.value }}
            registry.wattly.pl/joblin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release tag
        if: steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag

name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release version
        id: version
        run: node ./scripts/resolve-release-version.mjs "$GITHUB_OUTPUT"

      - name: Resolve build targets
        id: targets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            # main: wersjonowany obraz + latest (latest to obraz wdrazany przez autopull na produkcji)
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "registry.wattly.pl/joblin:${VERSION}"
              echo "registry.wattly.pl/joblin:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # branch: obraz testowy bez latest, zeby autopull nie wciagnal galezi na produkcje
            echo "is_main=false" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "registry.wattly.pl/joblin:branch-${SHORT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Release build"
            echo ""
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${SHA}\`"
            echo "- tryb: $([ "${GITHUB_REF_NAME}" = "main" ] && echo "produkcyjny (wersja + latest)" || echo "testowy (branch-${SHORT}, bez latest)")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.wattly.pl
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.title=Joblin
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.targets.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.targets.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release tag
        if: steps.targets.outputs.is_main == 'true' && steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$VERSION" "${{ steps.targets.outputs.sha }}"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.targets.outputs.is_main == 'true' && steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag

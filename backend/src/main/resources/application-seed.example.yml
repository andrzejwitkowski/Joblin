# Example seed — copy to application-local.yml and edit.
# Prefer full keys: jl_<16hex>_<secret>. Plain secrets also work; the
# generated jl_<id>_<secret> form is what bots must send (store it yourself).
joblin:
  seed-users:
    - id: user-1
      email: user1@gmail.com
      displayName: User One
      role: USER
      apiKey: "jl_0123456789abcdef_change-me-user-1"
    - id: user-2
      email: user2@gmail.com
      displayName: User Two
      role: USER
      apiKey: "jl_fedcba9876543210_change-me-user-2"
    - id: admin-1
      email: admin@gmail.com
      displayName: Admin
      role: ADMIN
      apiKey: "jl_aaaaaaaaaaaaaaaa_change-me-admin"
